server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Traefik terminates TLS in front; keep redirects relative so they stay on https.
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.(png|svg|ico|woff2|pdf|txt|webmanifest|xml)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Every route is a prerendered folder. A miss is a real 404, never the homepage.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    rewrite ^([^.]*[^/])$ $1/ permanent;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
