# Token by Token behind a Traefik that already owns ports 80 and 443 (Dokploy's).
# The container publishes no ports; Traefik routes DOMAIN to it and holds the certificate.
#
#   docker compose -p token-by-token -f deploy/docker-compose.yml up -d --build
#
# .env next to this file: DOMAIN=llm.example.com (and optionally TRAEFIK_NETWORK, TRAEFIK_CERT_RESOLVER).

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
    image: token-by-token-web
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-dokploy-network}
      traefik.http.routers.tokenbytoken.rule: Host(`${DOMAIN}`)
      traefik.http.routers.tokenbytoken.entrypoints: websecure
      traefik.http.routers.tokenbytoken.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.tokenbytoken.service: tokenbytoken
      traefik.http.routers.tokenbytoken-http.rule: Host(`${DOMAIN}`)
      traefik.http.routers.tokenbytoken-http.entrypoints: web
      traefik.http.routers.tokenbytoken-http.middlewares: redirect-to-https@file
      traefik.http.routers.tokenbytoken-http.service: tokenbytoken
      traefik.http.services.tokenbytoken.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
