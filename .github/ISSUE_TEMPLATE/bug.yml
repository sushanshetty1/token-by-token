name: Something is wrong
description: A wrong number, a broken animation, a page that does not load.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address, with the step number if it is a lesson (for example /day/4/qkv/#5).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone 15
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps.
